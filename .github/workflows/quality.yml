name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke desktop dan mobile
        run: |
          npm run start -- --hostname 127.0.0.1 &
          SMOKE_SCREENSHOTS=artifacts npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: phase-05-screenshots
          path: artifacts/
