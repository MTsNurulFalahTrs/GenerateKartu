name: Quality
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
  push:
    branches: [main]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit dependensi produksi
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --json > artifacts/npm-audit.json || true
          node -e 'const r=require("./artifacts/npm-audit.json"); console.log(r.metadata?.vulnerabilities ?? r.error ?? r)'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke desktop dan mobile
        run: |
          npm run start -- --hostname 127.0.0.1 &
          SMOKE_SCREENSHOTS=artifacts npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: artifacts/
